# Android 測試版：推到 android 分支（或在 Actions 頁面手動按 Run）就會編譯出可以直接安裝的 APK
name: Android 測試版
on:
  push:
    branches: [android]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: 把遊戲複製進 App
        run: npm run sync
      - name: 編譯測試版 APK
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: under-the-hammer-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
