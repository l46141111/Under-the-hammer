# Android 測試版：推到 android 分支（或在 Actions 頁面手動按 Run）就會編譯出可以直接安裝的 APK
name: Android 測試版
on:
  push:
    branches: [android]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: 把遊戲複製進 App
        run: npm run sync
      - name: 編譯測試版 APK
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: under-the-hammer-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - name: APK 資訊
        working-directory: app/android
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | sort -V | tail -1)
          INFO=$($AAPT dump badging app/build/outputs/apk/debug/*.apk | grep -E "^package:|^targetSdkVersion|^sdkVersion|^application-label:" | tr '\n' ' ')
          echo "::notice title=apk::$INFO"
      - name: 開啟模擬器需要的 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 在模擬器上試跑
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: .
          script: bash app/ci-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: smoke/
          retention-days: 14
